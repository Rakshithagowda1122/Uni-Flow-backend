services:
  - type: web
    name: uniflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGINS
        value: https://uni-flow-frontend-nine.vercel.app
      - key: SEED_PASSWORD
        sync: false
